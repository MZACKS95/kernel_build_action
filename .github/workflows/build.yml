name: Build AOSP 5.10.209 NetHunter Modules
on:
  workflow_dispatch:

jobs:
  Build-Kernel-Modules:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Build Modules Only
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://android.googlesource.com/kernel/common
          kernel-dir: android12-5.10
          kernel-branch: android12-5.10-2024-05_r1
          config: gki_defconfig
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          ksu: false
          android-version: 12
          aosp-clang-version: r416183b
          disable-lto: false
          anykernel3: false
          extra-cmd: |
            sed -i '/CONFIG_WLAN_VENDOR_MEDIATEK/d' arch/arm64/configs/gki_defconfig
            sed -i '/CONFIG_WLAN_VENDOR_ATH/d' arch/arm64/configs/gki_defconfig
            cat << 'EOF' >> arch/arm64/configs/gki_defconfig
            CONFIG_WIRELESS=y
            CONFIG_CFG80211=m
            CONFIG_CFG80211_WEXT=y
            CONFIG_MAC80211=m
            CONFIG_MAC80211_MESH=y
            CONFIG_MAC80211_DEBUGFS=y
            CONFIG_WLAN=y
            CONFIG_WLAN_VENDOR_MEDIATEK=y
            CONFIG_MT7601U=m
            CONFIG_WLAN_VENDOR_ATH=y
            CONFIG_ATH_CARDS=m
            CONFIG_ATH_COMMON=m
            CONFIG_ATH9K_HW=m
            CONFIG_ATH9K_COMMON=m
            CONFIG_ATH9K_HTC=m
            CONFIG_CARL9170=m
            EOF

      - name: Upload Kernel Modules (.ko)
        uses: actions/upload-artifact@v5
        with:
          name: aosp-5.10.209-nethunter-modules
          path: |
            android12-5.10/**/*.ko
            **/mt7601u.ko
            **/ath9k_htc.ko
            **/carl9170.ko
            **/mac80211.ko
            **/cfg80211.ko
