# A simple action usage
name: Build Custom GKI Kernel
on:
  workflow_dispatch:

jobs:
  Build-Kernel:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/MZACKS95/android_kernel_common-5.10.git
          kernel-dir: android12-5.10
          kernel-branch: android12-5.10
          config: gki_defconfig
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          ksu: true
          ksu-version: main
          android-version: 12
          aosp-clang-version: r416183b
          disable-lto: true
          anykernel3: true
      - name: Upload Kernel Modules (.ko)
        uses: actions/upload-artifact@v4
        with:
          name: nethunter-wifi-modules
          path: |
            android12-5.10/**/*.ko
            **/mt7601u.ko
            **/ath9k_htc.ko
            **/carl9170.ko
            **/mac80211.ko
            **/cfg80211.ko
